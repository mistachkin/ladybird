<!DOCTYPE html>
<body>
<script src="../include.js"></script>
<div id="container"></div>
<script type="text/th8">
set doc [dom::document]
set container [$doc getElementById container]

# Create and append elements
set p [$doc createElement p]
$p textContent "First paragraph"
$p setAttribute id para1
$container appendChild $p

set span [$doc createElement span]
$span textContent "Nested span"
$p appendChild $span

# Test innerHTML
set div [$doc createElement div]
$div setAttribute id html-div
$div innerHTML "<b>Bold text</b>"
$container appendChild $div
</script>
<script>
test(() => {
    let para = document.getElementById('para1');
    let htmlDiv = document.getElementById('html-div');

    if (para && para.textContent.includes('First paragraph')
        && htmlDiv && htmlDiv.innerHTML === '<b>Bold text</b>') {
        println("PASS: DOM manipulation works");
    } else {
        println("FAIL: DOM manipulation");
    }
});
</script>
</body>
