<!DOCTYPE html>
<body>
<script src="../include.js"></script>
<button id="btn">Click me</button>
<div id="result">pending</div>
<script type="text/th8">
# Register a TH8 proc as a click handler.
proc handleClick {event} {
    set type [dict get $event type]
    set doc [dom::document]
    set result [$doc getElementById result]
    $result textContent "clicked: $type"
}

set doc [dom::document]
set btn [$doc getElementById btn]
$btn addEventListener click handleClick
</script>
<script>
test(() => {
    // Simulate a click to trigger the TH8 event handler.
    document.getElementById('btn').click();

    // Verify the TH8 handler ran.
    let result = document.getElementById('result').textContent;
    if (result === 'clicked: click') {
        println("PASS: TH8 event listener handled click");
    } else {
        println("FAIL: expected 'clicked: click', got '" + result + "'");
    }
});
</script>
</body>
