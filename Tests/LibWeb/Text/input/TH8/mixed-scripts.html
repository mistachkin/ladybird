<!DOCTYPE html>
<body>
<script src="../include.js"></script>
<script>
// JS creates an element
let jsDiv = document.createElement('div');
jsDiv.id = 'js-created';
jsDiv.textContent = 'Created by JS';
document.body.appendChild(jsDiv);
</script>
<script type="text/th8">
# TH8 reads the JS-created element and modifies it
set doc [dom::document]
set elem [$doc getElementById js-created]
$elem setAttribute data-modified-by th8
$elem textContent "Modified by TH8"
</script>
<script>
test(() => {
    // JS verifies TH8's modification
    let div = document.getElementById('js-created');
    if (div && div.textContent === 'Modified by TH8'
        && div.getAttribute('data-modified-by') === 'th8') {
        println("PASS: TH8 and JS can share the DOM");
    } else {
        println("FAIL: mixed TH8/JS DOM interaction");
    }
});
</script>
</body>
