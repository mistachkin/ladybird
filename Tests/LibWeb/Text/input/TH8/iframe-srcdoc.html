<!DOCTYPE html>
<!--
    [M7a] Verifies TH8 runs inside an iframe srcdoc.  srcdoc creates
    a same-origin child document; TH8Context per-document state means
    the inner doc gets its own interpreter independent of the outer
    page.
-->
<body>
<script src="../include.js"></script>
<iframe srcdoc="
    <body>
    <div id='inner'>pending</div>
    <script type='text/th8'>
    set doc [dom::document]
    [$doc getElementById inner] textContent th8-ran-in-srcdoc
    </script>
    </body>
"></iframe>
<script>
asyncTest(done => {
    let f = document.querySelector('iframe');
    f.addEventListener('load', () => {
        let inner = f.contentDocument.getElementById('inner').textContent;
        if (inner === 'th8-ran-in-srcdoc') {
            println("PASS: TH8 runs in iframe srcdoc");
        } else {
            println("FAIL: inner='" + inner + "'");
        }
        done();
    });
});
</script>
</body>
