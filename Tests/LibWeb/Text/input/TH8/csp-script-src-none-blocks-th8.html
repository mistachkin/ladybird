<!DOCTYPE html>
<!--
    [M7] Verifies a CSP `script-src 'none'` blocks <script type="text/th8">
    just as it blocks <script>.  Without the CSP integration TH8 would
    constitute a scripting bypass.
-->
<meta http-equiv="Content-Security-Policy" content="script-src 'none'">
<body>
<div id="result">unblocked</div>
<script type="text/th8">
set doc [dom::document]
[$doc getElementById result] textContent "FAIL"
</script>
<script>
let r = document.getElementById('result').textContent;
if (r === 'unblocked') {
    println("PASS: CSP script-src 'none' blocked TH8 script");
} else {
    println("FAIL: TH8 script ran under script-src 'none' (" + r + ")");
}
</script>
</body>
